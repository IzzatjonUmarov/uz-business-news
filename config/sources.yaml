  - {id: sqb,        name: SQB (Узпромстройбанк),    group: bank, url: "https://sqb.uz/press-center/news-ru/"}
  - {id: ipoteka,    name: Ипотека-банк,             group: bank, url: "https://www.ipotekabank.uz/ru/blog/news/"}
  - {id: mkbank,     name: Микрокредитбанк,          group: bank, url: "https://mkbank.uz/ru/press_center/news/"}
  - {id: aloqabank,  name: Алокабанк,                group: bank, url: "https://aloqabank.uz/ru/press_center/news/"}
  - {id: turonbank,  name: Туронбанк,                group: bank, url: "https://turonbank.uz/ru/press_center/news/"}
