# Источники для мониторинга.
#
# Поля:
#   id        — уникальный ключ (латиница), используется в базе "уже отправлено"
#   name      — как подписывать источник в посте
#   group     — gov | regulator | bank | market | invest | media  (влияет на хэштеги)
#   url       — страница со списком новостей ИЛИ RSS-лента
#   type      — auto (по умолчанию: сначала ищем RSS на странице, потом парсим HTML) | rss | html |
#               govuz (сайты министерств на портале gov.uz — читаются через его API)
#   authority — для type: govuz — код организации из адреса gov.uz/ru/<код>/... (по умолчанию = id;
#               пустая строка "" — общая лента портала)
#   selectors — (необязательно) CSS-селекторы, если автопарсинг ошибается:
#                 item: блок одной новости, link: ссылка внутри блока, title: заголовок, date: дата
#   link_pattern — (необязательно) regex, которому должен соответствовать URL новости
#   requires_ai  — true: источник с большим потоком общих новостей, включается только при наличии
#                  ANTHROPIC_API_KEY, чтобы ИИ отсеивал небизнесовые новости
#   enabled   — false, чтобы выключить
#
# Проверка после правок:
#   python -m bot check            — сколько новостей нашлось в каждом источнике
#   python -m bot check --id cbu   — подробно по одному источнику
#
# Последняя проверка всех адресов: 02.11.2026.

sources:
  # ── Госорганы ───────────────────────────────────────────────
  - id: president
    name: Пресс-служба Президента
    group: gov
    url: https://president.uz/ru/lists/news
    link_pattern: /ru/lists/view/\d+

  - {id: gov,          name: Правительственный портал,              group: gov,       type: govuz, authority: "", url: "https://gov.uz/ru/news/news"}
  - {id: mfa,          name: МИД Узбекистана,                        group: gov,       type: govuz, url: "https://gov.uz/ru/mfa/news/news"}
  - {id: miit,         name: "Министерство инвестиций, промышленности и торговли", group: invest, type: govuz, url: "https://gov.uz/ru/miit/news/news"}
  - {id: soliq,        name: Налоговый комитет,                      group: gov,       type: govuz, url: "https://gov.uz/ru/soliq/news/news"}
  - {id: davaktiv,     name: Агентство по управлению госактивами,    group: invest,    type: govuz, url: "https://gov.uz/ru/davaktiv/news/news"}
  - {id: raqobat,      name: Комитет по развитию конкуренции,        group: regulator, type: govuz, url: "https://gov.uz/ru/raqobat/news/news"}
  - {id: digital,      name: Министерство цифровых технологий,       group: gov,       type: govuz, url: "https://gov.uz/ru/digital/news/news"}
  - {id: minenergy,    name: Министерство энергетики,                group: gov,       type: govuz, url: "https://gov.uz/ru/minenergy/news/news"}
  - {id: agro,         name: Министерство сельского хозяйства,       group: gov,       type: govuz, url: "https://gov.uz/ru/agro/news/news"}
  - {id: mintrans,     name: Министерство транспорта,                group: gov,       type: govuz, url: "https://gov.uz/ru/mintrans/news/news"}
  - {id: uzbektourism, name: Комитет по туризму,                     group: gov,       type: govuz, url: "https://gov.uz/ru/uzbektourism/news/news"}
  - {id: adliya,       name: Министерство юстиции,                   group: gov,       type: govuz, url: "https://gov.uz/ru/adliya/news/news"}
  - {id: uzatom,       name: Агентство «Узатом»,                     group: gov,       type: govuz, url: "https://gov.uz/ru/uzatom/news/news"}

  - id: invest
    name: Агентство по продвижению инвестиций
    group: invest
    url: https://invest.gov.uz/ru/media/news

  - id: stat
    name: Национальный комитет по статистике
    group: gov
    url: https://stat.uz/ru/press-tsentr/novosti-goskomstata

  - id: uza
    name: УзА — Национальное информагентство
    group: media
    type: rss
    url: https://uza.uz/ru/rss
    requires_ai: true

  # ── Регулятор и рынок ───────────────────────────────────────
  # cbu.uz закрыт для зарубежных IP: работает только с сервера в Узбекистане.
  - id: cbu
    name: Центральный банк
    group: regulator
    url: https://cbu.uz/ru/press_center/news/
    link_pattern: /ru/press_center/news/\d+

  - id: cbu_press
    name: Центральный банк — пресс-релизы
    group: regulator
    url: https://cbu.uz/ru/press_center/releases/
    link_pattern: /ru/press_center/releases/\d+

  - id: uzse
    name: Фондовая биржа «Тошкент»
    group: market
    url: https://uzse.uz/boards/news/list/
    link_pattern: /boards/\d+$

  # ── Банки ───────────────────────────────────────────────────
