  - {id: ipakyuli,   name: Ипак Йули банк,           group: bank, url: "https://ru.ipakyulibank.uz/news", link_pattern: "/news/[a-z0-9-]+$"}
  - {id: ofb,        name: Orient Finans Bank,       group: bank, url: "https://ofb.uz/ru/novosti"}
  - {id: infinbank,  name: InFinBank,                group: bank, url: "https://www.infinbank.com/ru/press/news/"}
  - {id: davrbank,   name: Давр банк,                group: bank, url: "https://davrbank.uz/ru/news"}
  - {id: trustbank,  name: Трастбанк,                group: bank, url: "https://trustbank.uz/ru/press_center/news/"}
  - {id: tbc,        name: TBC Bank Uzbekistan,      group: bank, url: "https://tbcbank.uz/ru/news/"}
  - {id: octobank,   name: Octobank,                 group: bank, url: "https://octobank.uz/ru/press-tsentr"}
  - {id: tengebank,  name: Tenge Bank,               group: bank, url: "https://tengebank.uz/ru/about/press_center"}
  - {id: garantbank, name: Garant Bank,              group: bank, url: "https://garantbank.uz/ru/press-center"}
  - {id: kdb,        name: KDB Bank Uzbekistan,      group: bank, url: "https://kdb.uz/ru/press-center/news"}

