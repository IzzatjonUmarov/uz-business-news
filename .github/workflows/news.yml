name: Публикация новостей

# Бот работает непрерывной цепочкой запусков: каждый запуск живёт ~5,5 часа (лимит GitHub — 6 ч),
# внутри проверяет источники каждые 15 минут и публикует не чаще одного поста в POST_INTERVAL_MINUTES,
# а перед завершением сам запускает следующий. Запустить цепочку достаточно один раз
# (Actions → Публикация новостей → Run workflow). Расписание — запасной вариант, если цепочка прервётся.
# Пауза: Actions → Публикация новостей → «…» → Disable workflow.
on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch: {}
  # обновление кода бота тоже запускает цепочку (если она уже идёт — новый запуск подождёт текущий)
  push:
    branches: [main]
    paths: ["bot/**", "config/**", "requirements.txt", ".github/workflows/news.yml", "scripts/push_state.sh"]

# одновременно работает только один запуск; следующий ждёт окончания текущего
concurrency:
  group: news
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Проверить токен бота
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::Не задан секрет TELEGRAM_BOT_TOKEN (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      # Состояние (что уже отправлено, очередь, время последнего поста) хранится в ветке bot-state
      - name: Загрузить состояние
        run: |
          mkdir -p data
          if git fetch --depth=1 origin bot-state 2>/dev/null; then
            git show FETCH_HEAD:state.json > data/state.json
            echo "Состояние загружено"
          else
            echo "Ветки bot-state ещё нет — первый запуск"
          fi

      - name: Работа бота (~5,5 часа)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || '@umarovs_news' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL || 'claude-opus-5-5' }}
          MIN_IMPORTANCE: ${{ vars.MIN_IMPORTANCE || '3' }}
          MIN_IMPORTANCE_RULES: ${{ vars.MIN_IMPORTANCE_RULES || '1.8' }}
          POST_INTERVAL_MINUTES: ${{ vars.POST_INTERVAL_MINUTES || '30' }}
          # после каждого поста и каждой проверки состояние сразу уходит в bot-state — без дублей при сбое
          STATE_SYNC_CMD: ./scripts/push_state.sh
        run: python -m bot run --with-rates --loop 900 --max-runtime 19800

      - name: Сохранить состояние
        if: ${{ !cancelled() }}
        run: ./scripts/push_state.sh

      - name: Запустить следующий запуск цепочки
        if: ${{ !cancelled() }}
        run: |
          busy=$(gh run list --workflow news.yml --limit 20 --json status,databaseId \
            --jq "[.[] | select(.databaseId != ${GITHUB_RUN_ID} and (.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\"))] | length")
          if [ "$busy" = "0" ]; then
            gh workflow run news.yml --ref "${GITHUB_REF_NAME}"
            echo "Следующий запуск поставлен в очередь"
          else
            echo "Следующий запуск уже ждёт — новый не нужен"
          fi
